<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="캐릭터별 보스 수행 능력을 비교해 최적의 메이플 보스파티를 추천합니다."><title>보스팟 연구소</title><link rel="stylesheet" href="styles.css"></head><body>
<header><button class="logo"><i>BP</i><span>보스팟<br><b>연구소</b></span></button><div class="header-note">PARTY COMPOSITION LAB</div></header>
<main><section class="intro"><div><p class="kicker">BOSS PARTY BUILDER</p><h1>누구랑 가야<br><em>딱 맞을까?</em></h1><p>캐릭터들의 보스 수행 능력을 비교해<br>낭비 없이 안정적인 파티를 조합해드려요.</p></div><aside class="target-card"><span>오늘의 실험</span><label>도전 보스<select id="boss"><option data-cut="100">하드 세렌</option><option data-cut="100">카오스 칼로스</option><option data-cut="100">노말 카링</option><option data-cut="100">하드 림보</option><option data-cut="100">익스트림 스우</option></select></label><label>파티 인원<select id="size"><option value="2">2인</option><option value="3" selected>3인</option><option value="4">4인</option><option value="6">6인</option></select></label><div class="goal"><span>파티 목표 기여도</span><strong>100%</strong></div></aside></section>
<section class="workspace"><div class="section-head"><div><span>01</span><h2>후보 캐릭터</h2><p>환산주스탯에서 확인한 보스 기여도를 입력하세요.</p></div><button id="add" class="outline">＋ 캐릭터 추가</button></div><div id="roster" class="roster"></div><button id="recommend" class="cta">최적 파티 짜기 <b>→</b></button></section>
<section id="results" class="results hidden"><div class="section-head"><div><span>02</span><h2>추천 조합</h2><p>목표 달성률과 직업 시너지를 함께 계산했어요.</p></div><button id="reset" class="text-btn">결과 닫기</button></div><div id="result-list" class="result-list"></div><p class="disclaimer">추천 결과는 입력값에 따른 참고용입니다. 실제 클리어 여부는 직업 상성, 숙련도, 생존과 보스 패턴에 따라 달라질 수 있어요.</p></section>
</main><template id="char-template"><article class="char-card"><div class="avatar">?</div><div class="char-fields"><label>캐릭터 닉네임<input class="nickname" placeholder="닉네임"></label><label>직업<select class="job"><option>아델</option><option>비숍</option><option>나이트로드</option><option>은월</option><option>메르세데스</option><option>소울마스터</option><option>히어로</option><option>윈드브레이커</option><option>듀얼블레이드</option><option>아크</option><option>팬텀</option><option>기타</option></select></label><label>보스 기여도<div class="percent"><input class="power" type="number" min="1" max="200" value="35"><b>%</b></div></label><label>숙련도<select class="skill"><option value="0.9">초행</option><option value="1" selected>보통</option><option value="1.08">숙련</option></select></label></div><button class="remove" aria-label="캐릭터 삭제">×</button></article></template><div id="toast"></div><script src="app.js"></script></body></html>
